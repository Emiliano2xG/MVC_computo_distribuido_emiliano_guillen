services:
  base_de_datos:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tareas_db
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tareas_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker_vistas:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      NOMBRE_WORKER: vistas
      PORT: 8080
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: tareas_db
      DB_HOST: base_de_datos
      DB_PORT: 5432
    depends_on:
      base_de_datos:
        condition: service_healthy

  worker_tareas:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      NOMBRE_WORKER: tareas
      PORT: 8080
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: tareas_db
      DB_HOST: base_de_datos
      DB_PORT: 5432
    depends_on:
      base_de_datos:
        condition: service_healthy

  middleware:
    build:
      context: .
      dockerfile: Dockerfile.middleware
    environment:
      PORT: 8080
      WORKER_VISTAS: http://worker_vistas:8080
      WORKER_TAREAS: http://worker_tareas:8080
    ports:
      - "8080:8080"
    depends_on:
      - worker_vistas
      - worker_tareas

volumes:
  datos_postgres:
