# Reverse proxy / API gateway + load balancer (nginx)
# Corre en su propio contenedor, entre el frontend (puerto 3000) y los
# servicios backend (materias, alumnos, inscripciones).
#
# Este archivo se copia a /etc/nginx/conf.d/default.conf (contexto http).

# ---------------------------------------------------------------------------
# Bitacora: incluye a que replica se mando cada peticion ($upstream_addr)
# ---------------------------------------------------------------------------
log_format gateway '$remote_addr [$time_local] "$request" $status '
                   'upstream=$upstream_addr upstream_status=$upstream_status '
                   'rt=$request_time urt=$upstream_response_time';

access_log /dev/stdout gateway;
error_log  /dev/stderr warn;

# ---------------------------------------------------------------------------
# Upstreams: un grupo por servicio, 3 replicas cada uno.
# Algoritmo: round robin (por defecto). Alternativa: agregar `least_conn;`
# Health check pasivo: si una replica falla 2 veces seguidas, nginx la saca
# de la rotacion durante 10 s y luego vuelve a intentar.
# ---------------------------------------------------------------------------
upstream materias_backend {
    server servicio_materias_1:8080 max_fails=2 fail_timeout=10s;
    server servicio_materias_2:8080 max_fails=2 fail_timeout=10s;
    server servicio_materias_3:8080 max_fails=2 fail_timeout=10s;
}

upstream alumnos_backend {
    server servicio_alumnos_1:8080 max_fails=2 fail_timeout=10s;
    server servicio_alumnos_2:8080 max_fails=2 fail_timeout=10s;
    server servicio_alumnos_3:8080 max_fails=2 fail_timeout=10s;
}

upstream inscripciones_backend {
    server servicio_inscripciones_1:8080 max_fails=2 fail_timeout=10s;
    server servicio_inscripciones_2:8080 max_fails=2 fail_timeout=10s;
    server servicio_inscripciones_3:8080 max_fails=2 fail_timeout=10s;
}

server {
    listen 8000;
    server_name _;

    # --- Parametros comunes del proxy -------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Connection "";                       # keep-alive hacia backends
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Un backend caido (contenedor detenido) no debe colgar la peticion:
    proxy_connect_timeout 2s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # Failover: si la replica falla, se reintenta con la siguiente.
    # Por defecto nginx NO reintenta POST/DELETE no idempotentes, asi que una
    # alta de inscripcion nunca se duplica por un reintento.
    proxy_next_upstream         error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries   3;
    proxy_next_upstream_timeout 10s;

    # --- Cabeceras CORS (el frontend en :3000 llama a :8000) --------------
    add_header Access-Control-Allow-Origin   "*" always;
    add_header Access-Control-Allow-Methods  "GET, POST, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers  "Content-Type" always;
    add_header Access-Control-Expose-Headers "X-Instance-Id, X-Upstream" always;
    # Replica de nginx que atendio (util para demostrar el balanceo)
    add_header X-Upstream $upstream_addr always;

    # --- Endpoints propios del gateway ------------------------------------
    location = /heartbeat {
        default_type text/plain;
        return 200 "gateway alive";
    }

    # Metricas de nginx (conexiones activas, peticiones atendidas)
    location = /status {
        stub_status;
    }

    # --- Rutas hacia los servicios ----------------------------------------
    location /materias {
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass http://materias_backend;
    }

    location /alumnos {
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass http://alumnos_backend;
    }

    location /inscripciones {
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass http://inscripciones_backend;
    }

    location / {
        default_type application/json;
        return 404 '{"error":"ruta no encontrada en el gateway"}';
    }
}
