<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tareas por hacer</title>
    <link rel="stylesheet" href="/static/css/estilos.css">
</head>
<body class="fondo">
    <h1 class="titulo">Tareas por hacer</h1>
    <h2 class="subtitulo">Tareas de la escuela</h2>
    <div class="lista">
        <ul class="lista-items">
            {{range .}}
            <li>
                <form action="/tareas/completar" method="POST" class="form-completar">
                    <input type="hidden" name="id" value="{{.ID}}">
                    <input
                        type="checkbox"
                        class="checkbox"
                        {{if .Completada}}checked{{end}}
                        onchange="this.form.submit()"
                    >
                    <span>{{.Titulo}}</span>
                </form>
            </li>
            {{else}}
            <li>No hay tareas todavía. Agrega tu primeraaa!</li>
            {{end}}
        </ul>

        <form class="formulario" action="/tareas" method="POST">
            <input
                type="text"
                name="tarea"
                class="input-tarea"
                placeholder="Escribe una nueva tarea..."
                required
            >
            <button type="submit" class="boton-enviar">Agregar</button>
        </form>
    </div>
</body>
</html>
